<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apps</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff6e0; --card:#fff; --ink:#3b2a20; --muted:#7a6656; --line:#ecd9b8; --accent:#f2a516; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1813; --card:#2a221b; --ink:#f4e9d8; --muted:#bba892; --line:#4a3b2e; --accent:#ffcf5a; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.7 "Noto Sans KR", system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:40px 16px; }
  h1 { font-family:Jua, sans-serif; font-weight:400; font-size:34px; margin:0 0 20px; }
  .app { display:flex; gap:16px; align-items:center; background:var(--card); border:2px solid var(--line); border-radius:20px; padding:16px; }
  .app img { width:80px; height:80px; border-radius:20px; flex:none; }
  .app b { font-family:Jua, sans-serif; font-weight:400; font-size:22px; }
  .app p { margin:2px 0 6px; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>우리가 만든 앱</h1>
  <div class="app">
    <img src="hamster-hero/icon.png" alt="햄찌 용사 아이콘">
    <div>
      <b>햄찌 용사: 방치형 키우기 &amp; 카페</b>
      <p>광고도 결제도 없는 완전 무료 어린이 게임</p>
      <a href="hamster-hero/privacy.html">개인정보처리방침</a>
    </div>
  </div>
</main>
</body>
</html>
